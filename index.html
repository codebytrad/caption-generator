<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KI-Caption-Generator für Creator</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            padding: 40px 20px;
            text-align: center;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            font-size: 1.1rem;
            color: #94a3b8;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .box {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border: 1px solid #334155;
        }
        input[type="email"] {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            font-size: 1rem;
            box-sizing: border-box;
        }
        button {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #7dd3fc;
        }
        .footer-note {
            margin-top: 20px;
            font-size: 0.85rem;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Generiere virale Captions in 3 Sekunden per KI</h1>
        <p>Schluss mit stundenlangen Schreibblockaden. Erstelle optimierte Untertitel und Nischen-Hashtags für TikTok, Instagram Reels und YouTube Shorts, die deine Reichweite verdoppeln.</p>
        
        <div class="box">
            <form action="https://formspree.io/f/maqrzgra" method="POST">

                <input type="email" placeholder="Deine E-Mail-Adresse eingeben..." required>
                <button type="submit">Frühen Beta-Zugang sichern</button>
            </form>
            <div class="footer-note">100% kostenloser Start. Keine Kreditkarte erforderlich.</div>
        </div>
    </div>

</body>
</html>
